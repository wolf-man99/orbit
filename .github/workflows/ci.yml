name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Boundaries · Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      # The architecture is a build gate, not a review convention. (Phase 4 §5.1)
      - run: pnpm boundaries
      # Contrast is objectively checkable, so it is checked. (PRD ACC-02)
      - run: pnpm check:contrast
      - run: pnpm test

  ledger-invariants:
    name: Ledger invariants
    runs-on: ubuntu-latest
    # The ledger's guarantees are its contract. A migration that breaks one must
    # fail the build rather than reach production. (Phase 3 §9)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orbit
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
    env:
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/orbit
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orbit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      - run: pnpm db:sql
      - run: pnpm db:verify
      # RLS is only real if the RUNTIME connection is subject to it. That
      # cannot be verified by reading the schema — only by connecting as the
      # application does. A correct-looking policy set attached to an exempt
      # connection is the most dangerous failure mode in this system.
      - name: Provision the application role
        run: |
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -v password="'ci-only-password'"             -f prisma/sql/005_app_role.sql
      - name: Verify RLS applies to the runtime connection
        env:
          DATABASE_URL: postgresql://orbit_app:ci-only-password@localhost:5432/orbit
        run: pnpm db:verify-rls

  e2e:
    name: E2E critical paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e

  budget:
    name: Bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm build
      # PRD P-05: initial JS under 180KB gzipped. A gate, not a guideline.
      - run: pnpm size
